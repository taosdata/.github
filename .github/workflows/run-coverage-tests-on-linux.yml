name: TDengine Coverage (taosd & taosc)
description: Reusable Workflow for taosd & taosc coverage test

on:
  workflow_call:
    inputs:
      specified_tdinternal_test_branch:
        description: 'Enter the test branch of TDinternal'
        required: true
        type: string
      specified_tdengine_test_branch:
        description: 'Enter the test branch of TDengine'
        required: true
        type: string

jobs:
  validate_tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.8'

      - name: Get all changed case files
        id: changed-case-files
        uses: tj-actions/changed-files@v45
        with:
          files: |
            test/cases/**/test_*.py

      - name: Validate test files
        if: steps.changed-case-files.outputs.any_changed == 'true'
        env:
          ALL_CHANGED_FILES: ${{ steps.changed-case-files.outputs.all_changed_files }}
        run: |
          EXIT_CODE=0
          for file in ${ALL_CHANGED_FILES}; do
            echo "$file was changed"
            python .github/scripts/validate_tests.py "$file" || EXIT_CODE=1
          done
          exit $EXIT_CODE

  run-tests:
    strategy:
      fail-fast: false
      matrix:
        platform: [linux]
        include:
          - platform: linux
            runner_group: CI
            runner_labels: [self-hosted, Linux, X64, stream_testing]
            WKDIR: '/var/lib/jenkins/workspace'
            WK: '/var/lib/jenkins/workspace/TDinternal'
            WKC: '/var/lib/jenkins/workspace/TDinternal/community'
    runs-on:
      group: ${{ matrix.runner_group }}
      labels: ${{ matrix.runner_labels }}

    needs: validate_tests

    timeout-minutes: 4320

    env:
      CONTAINER_NAME: 'taosd-test'
      WKDIR: ${{ matrix.WKDIR }}
      WK: ${{ matrix.WK }}
      WKC: ${{ matrix.WKC }}
      IS_TDINTERNAL: ${{ inputs.tdinternal }}
      CURRENT_PLATFORM: ${{ matrix.platform }}
      TARGET_BRANCH: ${{ inputs.specified_tdengine_test_branch }}
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      LANG: en_US.UTF-8      
      SOURCE_BRANCH_TDINTERNAL: ""
      SOURCE_BRANCH_TDENGINE: ""

    defaults:
      run:
        working-directory: ${{ github.workspace }}/.github/scripts/

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          repository: 'taosdata/.github'
          ref: 'test_coverage'
          fetch-depth: 0

      - name: Set environment variables based on condition
        run: |
          echo "Setting SOURCE_BRANCH_TDENGINE and SOURCE_BRANCH_TDINTERNAL based on inputs..."
          echo "SOURCE_BRANCH_TDINTERNAL=${{ inputs.specified_tdinternal_test_branch }}" >> $GITHUB_ENV
          echo "SOURCE_BRANCH_TDENGINE=${{ inputs.specified_tdengine_test_branch }}" >> $GITHUB_ENV
          echo "TARGET_BRANCH=${{ inputs.specified_tdengine_test_branch }}" >> $GITHUB_ENV
          echo "Current step debug (GITHUB_ENV content):"
          cat $GITHUB_ENV

      - name: Prepare TDinternal repository
        env:
          REPO_BRANCH: ${{ env.SOURCE_BRANCH_TDINTERNAL }}
        run: |
          set -euo pipefail
          echo "Preparing TDinternal repository (branch: ${REPO_BRANCH})..."
          cd "${{ env.WK }}"
          git reset --hard
          git clean -fd
          git remote prune origin
          git fetch origin
          if ! git rev-parse --verify "origin/${REPO_BRANCH}" >/dev/null 2>&1; then
            echo "Branch '${REPO_BRANCH}' does not exist on origin."
            git branch -r | head -20
            exit 1
          fi
          if git show-ref --verify --quiet "refs/heads/${REPO_BRANCH}"; then
            git switch "${REPO_BRANCH}"
          else
            git switch -c "${REPO_BRANCH}" "origin/${REPO_BRANCH}"
          fi
          echo "Pulling latest code from ${REPO_BRANCH}..."
          git pull --ff-only origin "${REPO_BRANCH}" || git pull origin "${REPO_BRANCH}"
          echo "Current branch: $(git branch --show-current)"
          git log -1 --oneline

      - name: Prepare TDengine repository
        env:
          REPO_BRANCH: ${{ env.SOURCE_BRANCH_TDENGINE }}
        run: |
          set -euo pipefail
          echo "Preparing TDengine repository (branch: ${REPO_BRANCH})..."
          cd "${{ env.WKC }}"
          git reset --hard
          git clean -fd
          git remote prune origin
          git fetch origin
          if ! git rev-parse --verify "origin/${REPO_BRANCH}" >/dev/null 2>&1; then
            echo "Branch '${REPO_BRANCH}' does not exist on origin."
            git branch -r | head -20
            exit 1
          fi
          if git show-ref --verify --quiet "refs/heads/${REPO_BRANCH}"; then
            git switch "${REPO_BRANCH}"
          else
            git switch -c "${REPO_BRANCH}" "origin/${REPO_BRANCH}"
          fi
          echo "Pulling latest code from ${REPO_BRANCH}..."
          git pull --ff-only origin "${REPO_BRANCH}" || git pull origin "${REPO_BRANCH}"
          echo "Current branch: $(git branch --show-current)"
          git log -1 --oneline

      - name: Build docker or repo
        run: python3 build.py
        env:
          BUILD_TYPE: ${{ matrix.platform == 'linux' && 'docker' || 'repo' }}

      - name: Run function test cases
        run: python3 test.py
        env:
          TEST_TYPE: 'function'
        continue-on-error: true

      - name: Run coverage test 
        if: matrix.platform == 'linux'
        run: python3 test.py
        env:
          TEST_TYPE: 'coverage'
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
